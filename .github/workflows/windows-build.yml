name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile tray app
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $icon = Join-Path $PWD 'windows\DisplaySwitch.ico'
          $output = Join-Path $PWD 'windows\TraySwitcher.exe'
          $source = Join-Path $PWD 'windows\TraySwitcher.cs'
          & $compiler /nologo /codepage:65001 /target:winexe /r:System.Windows.Forms.dll /r:System.Drawing.dll "/win32icon:$icon" "/out:$output" "$source"
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          if (-not (Test-Path windows/TraySwitcher.exe)) { throw 'Executable missing' }
      - name: Package
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $pkg = Join-Path $PWD "pkg\显示器切换"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item windows\TraySwitcher.exe, windows\DisplaySwitch.ico, windows\install.ps1, windows\install.bat $pkg
          Compress-Archive -Path $pkg -DestinationPath "DisplaySwitch-Windows-$v.zip" -Force
          "ZIP=DisplaySwitch-Windows-$v.zip" | Out-File -Append $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: DisplaySwitch-Windows
          path: ${{ env.ZIP }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes "见 README" }
          gh release upload $env:GITHUB_REF_NAME $env:ZIP --clobber
